# ClinicFlow CI/CD
#
#   backend tests ─┐
#   migrations ────┤
#   frontend build ┼─► build + Trivy scan (x2) ─► push to GHCR (x2, tag = commit SHA)
#   secret + SAST ─┤        └ fails on fixable           │
#   helm lint ─────┘          HIGH/CRITICAL               ▼
#                                          deploy to kind with Helm + smoke test
#                                                         │
#                                                         ▼
#                                     promote: commit the SHA to gitops/values-gitops.yaml
#                                     -> Argo CD syncs the real cluster to it
name: CI/CD - ClinicFlow

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "screenshots/**"
      - "demo/**"
      - "gitops/values-gitops.yaml"   # written by this pipeline; must not trigger it again
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (any failure fails the build - no image is built from broken code)
        run: python -m pytest -v --cov=app --cov-report=term-missing --junitxml=test-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: backend-test-results, path: backend/test-results.xml }

  migrations:
    name: Alembic migrations on PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: clinicflow, POSTGRES_USER: clinicflow, POSTGRES_PASSWORD: ci-only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinicflow" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://clinicflow:ci-only@localhost:5432/clinicflow
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: upgrade -> downgrade -> upgrade (every migration is reversible)
        run: |
          alembic upgrade head && alembic current
          alembic downgrade base
          alembic upgrade head && alembic current
      - name: race - three replicas migrate an empty database at the same time
        run: |
          alembic downgrade base
          for i in 1 2 3; do (alembic upgrade head > "race-$i.log" 2>&1; echo "replica $i exit $?" >> race-$i.log) & done
          wait
          for i in 1 2 3; do echo "--- replica $i"; cat "race-$i.log"; done
          grep -h "exit" race-*.log | grep -vq "exit 0" && { echo "a replica failed"; exit 1; } || true
          test "$(grep -l 'Running upgrade' race-*.log | wc -l)" -eq 1   # exactly one replica did the work
          alembic current | grep -q 0003_create_appointment_events

  frontend-build:
    name: Frontend build (React + Vite)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: npm audit (runtime dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high

  security:
    name: Secret scan + SAST
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }      # scan the whole history, not only the last commit
      - name: Gitleaks - no credentials anywhere in the Git history
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --no-banner --redact --config /repo/security/.gitleaks.toml
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Bandit - Python SAST (medium severity and above fails)
        run: pip install bandit==1.9.4 && bandit -c security/bandit.yaml -r backend/app -ll

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: lint + render default, dev, prod and GitOps values (helm is preinstalled on the runner)
        run: |
          for f in "" "-f helm/clinicflow/values-dev.yaml" "-f helm/clinicflow/values-prod.yaml" "-f gitops/values-gitops.yaml"; do
            helm lint helm/clinicflow $f --set backend.image.tag=ci --set frontend.image.tag=ci
            helm template clinicflow helm/clinicflow $f --set backend.image.tag=ci --set frontend.image.tag=ci > /dev/null
          done

  images:
    name: Build + Trivy scan (${{ matrix.component }})
    needs: [backend-tests, migrations, frontend-build, security, helm-lint]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Image name (tag = full commit SHA, never "latest")
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/clinicflow-${{ matrix.component }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: docker build
        run: |
          docker build --build-arg APP_VERSION=${GITHUB_SHA::7} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            -t "${{ steps.meta.outputs.image }}" ${{ matrix.component }}
      - name: Trivy scan (fails the build on fixable HIGH/CRITICAL)
        run: |
          set +e
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/security:/cfg" \
            "$TRIVY_IMAGE" image --config /cfg/trivy.yaml "${{ steps.meta.outputs.image }}" | tee trivy.txt
          rc=${PIPESTATUS[0]}
          { echo "### Trivy - ${{ matrix.component }} (exit code $rc)"; echo '```'; sed -n '/Report Summary/,$p' trivy.txt | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Save the scanned image (the push job pushes exactly these bytes, no rebuild)
        run: docker save "${{ steps.meta.outputs.image }}" -o image.tar
      - uses: actions/upload-artifact@v7
        with: { name: "image-${{ matrix.component }}", path: image.tar, retention-days: 1 }

  push:
    name: Push ${{ matrix.component }} to GHCR
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v8
        with: { name: "image-${{ matrix.component }}" }
      - run: docker load -i image.tar
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: docker push (short-lived GITHUB_TOKEN - no registry password stored anywhere)
        run: docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/clinicflow-${{ matrix.component }}:${GITHUB_SHA}"

  deploy:
    name: Deploy with Helm + smoke test
    needs: push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with: { cluster_name: clinicflow }
      - name: helm upgrade --install (pulls the images just pushed to GHCR)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          kubectl apply -f k8s/namespace.yaml
          kubectl -n clinicflow create secret docker-registry ghcr \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" --docker-password="${{ secrets.GITHUB_TOKEN }}"
          helm upgrade --install clinicflow helm/clinicflow --namespace clinicflow \
            --set backend.image.repository="ghcr.io/$OWNER/clinicflow-backend" --set backend.image.tag="$GITHUB_SHA" \
            --set frontend.image.repository="ghcr.io/$OWNER/clinicflow-frontend" --set frontend.image.tag="$GITHUB_SHA" \
            --set 'imagePullSecrets[0].name=ghcr' --set ingress.enabled=false --set monitoring.enabled=false \
            --set backend.autoscaling.enabled=false \
            --wait --timeout 6m
          helm list -n clinicflow
          kubectl get pods,svc -n clinicflow -o wide
      - name: Smoke test through the frontend (nginx -> backend -> PostgreSQL)
        run: |
          kubectl -n clinicflow port-forward svc/clinicflow-frontend 8080:80 >/dev/null 2>&1 &
          for i in $(seq 20); do curl -fs localhost:8080/healthz >/dev/null && break; sleep 1; done
          set -x
          curl -fs localhost:8080/ | grep -o "<title>.*</title>"
          version=$(curl -fs localhost:8080/api/info | jq -r .version)
          test "$version" = "${GITHUB_SHA::7}"            # the pod runs the commit under test
          doc=$(curl -fs -X POST localhost:8080/api/doctors -H 'Content-Type: application/json' \
                -d '{"name":"Dr. Pipeline","specialty":"CI","room":"0"}' | jq .id)
          tomorrow=$(TZ=Asia/Kolkata date -d tomorrow +%F)
          body="{\"doctor_id\":$doc,\"patient_name\":\"Smoke Test\",\"patient_phone\":\"9000000000\",\"starts_at\":\"${tomorrow}T10:00:00\"}"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/appointments -H 'Content-Type: application/json' -d "$body")" = 201
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/appointments -H 'Content-Type: application/json' -d "$body")" = 409
          curl -fs "localhost:8080/api/stats?date=$tomorrow" | jq -c .by_status

  promote:
    name: Promote to GitOps (Argo CD)
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Commit the new image tags to gitops/values-gitops.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main
            sed -i -E "s/^(    tag: ).*/\1\"${GITHUB_SHA}\"/" gitops/values-gitops.yaml
            git diff --quiet && { echo "already at ${GITHUB_SHA}"; exit 0; }
            git commit -qam "gitops: deploy clinicflow ${GITHUB_SHA::7}"
            git push origin HEAD:main && break
            git reset --hard -q origin/main
          done
          cat gitops/values-gitops.yaml
          echo "Argo CD will sync ${GITHUB_SHA::7} on its next poll" >> "$GITHUB_STEP_SUMMARY"
