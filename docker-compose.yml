# Full local stack: PostgreSQL + FastAPI backend + React/nginx frontend.
#   docker compose up --build        -> http://localhost:3000   (API docs: http://localhost:8000/docs)
#   ./scripts/seed.sh                -> load a demo clinic day through the API
#   docker compose down [-v]         -> stop (and delete the database volume)
name: clinicflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clinicflow
      POSTGRES_USER: clinicflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicflow-dev}   # local-only default; override in .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicflow -d clinicflow"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    image: clinicflow-backend:local
    environment:
      APP_ENV: compose
      DB_HOST: postgres
      DB_NAME: clinicflow
      DB_USER: clinicflow
      DB_PASSWORD: ${POSTGRES_PASSWORD:-clinicflow-dev}
      CLINIC_TZ: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

  frontend:
    build: ./frontend
    image: clinicflow-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  pgdata:
