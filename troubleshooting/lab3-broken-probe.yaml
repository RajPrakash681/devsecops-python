# Lab 3 - the lab-results viewer is Running but never becomes Ready, so it never gets traffic.
#   kubectl apply -f troubleshooting/lab3-broken-probe.yaml
#   kubectl get pods -n clinicflow-lab -l app=lab-results   (READY 0/1, no restarts)
apiVersion: v1
kind: Namespace
metadata:
  name: clinicflow-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-results
  namespace: clinicflow-lab
spec:
  replicas: 2
  selector:
    matchLabels: { app: lab-results }
  template:
    metadata:
      labels: { app: lab-results }
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lab-results
  namespace: clinicflow-lab
spec:
  selector: { app: lab-results }
  ports:
    - { name: http, port: 80, targetPort: http }
