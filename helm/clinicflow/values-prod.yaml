# Production overrides (EKS): more replicas, a managed database, a real hostname.
backend:
  env:
    APP_ENV: prod
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: "1", memory: 512Mi }
  autoscaling:
    minReplicas: 3
    maxReplicas: 10
frontend:
  replicaCount: 3
postgres:
  enabled: false                       # Amazon RDS instead of an in-cluster StatefulSet
  existingSecret: clinicflow-db        # created out-of-band, never committed
externalDatabase:
  host: clinicflow.xxxxxxxx.ap-south-1.rds.amazonaws.com
ingress:
  host: clinicflow.example.com
