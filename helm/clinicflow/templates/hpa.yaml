{{- if .Values.backend.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cf.name" . }}-backend
  labels: {{- include "cf.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cf.name" . }}-backend
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }} }
  behavior:
    scaleUp:
      policies: [{ type: Pods, value: 2, periodSeconds: 15 }]   # at most +2 pods per 15 s
    scaleDown:
      stabilizationWindowSeconds: 60   # demo-friendly; the default 300 s hides scale-down in a live demo
{{- end }}
