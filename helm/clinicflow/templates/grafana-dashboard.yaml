{{- if .Values.monitoring.enabled }}
# Grafana's sidecar (kube-prometheus-stack) loads every ConfigMap labelled grafana_dashboard=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cf.name" . }}-dashboard
  labels:
    {{- include "cf.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  clinicflow.json: |-
{{ .Files.Get "dashboards/clinicflow.json" | indent 4 }}
{{- end }}
