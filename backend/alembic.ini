[alembic]
script_location = alembic
# The `alembic` console script does not put the working directory on sys.path; without this
# line `from app.config import ...` in env.py fails inside the container.
prepend_sys_path = .
path_separator = os
# The database URL comes from the environment in alembic/env.py - never stored here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
